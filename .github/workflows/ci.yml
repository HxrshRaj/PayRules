name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      # Cache the Stack-managed GHC and the built snapshot packages.
      - name: Cache ~/.stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-home-${{ hashFiles('stack.yaml.lock', 'PayRules.cabal') }}
          restore-keys: ${{ runner.os }}-stack-home-

      # Cache this project's own build products, keyed on the sources. Includes
      # server/static/** because it's embedded into the binary at compile time
      # (Template Haskell) -- a change there doesn't touch any .hs file.
      - name: Cache .stack-work
        uses: actions/cache@v4
        with:
          path: .stack-work
          key: ${{ runner.os }}-stack-work-${{ hashFiles('stack.yaml.lock', 'PayRules.cabal', '**/*.hs', 'server/static/**') }}
          restore-keys: ${{ runner.os }}-stack-work-

      # -Werror in CI only: local builds warn, CI refuses to merge a warning.
      - name: Build (warnings are errors)
        run: stack build --test --no-run-tests --ghc-options=-Werror

      - name: Run the property suite
        run: stack test

      - name: Smoke-test the HTTP API and demo UI
        run: |
          PORT=8080 stack exec payrules-server &
          pid=$!
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break || sleep 1; done
          echo
          curl -sf localhost:8080/ | tee /tmp/index.html | grep -q '<html'
          grep -qi 'text/html' <(curl -sfI localhost:8080/)
          curl -sf -X POST localhost:8080/authorize \
            -H 'content-type: application/json' \
            -d '{"account":"acc-001","amount":{"currency":"USD","minorUnits":4200},"merchant":{"id":"m-x","name":"Corner Shop","category":"Grocery"}}' \
            | tee /tmp/resp.json
          echo
          grep -q '"decision":"approved"' /tmp/resp.json
          curl -sf -X POST localhost:8080/authorize \
            -H 'content-type: application/json' \
            -d '{"account":"acc-001","amount":{"currency":"GBP","minorUnits":1000},"merchant":{"id":"m-x","name":"Corner Shop","category":"Grocery"}}' \
            | tee /tmp/resp2.json
          echo
          grep -q '"decision":"declined"' /tmp/resp2.json
          kill "$pid"
