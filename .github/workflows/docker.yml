name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GHCR with the built-in token; no user secret

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run -d --name payrules -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 30); do curl -sf localhost:8080/healthz && break || sleep 1; done
          echo
          curl -sf -X POST localhost:8080/authorize -H 'content-type: application/json' \
            -d '{"account":"acc-001","amount":{"currency":"USD","minorUnits":4200},"merchant":{"id":"m","name":"Shop","category":"Grocery"}}' \
            | tee /tmp/r.json
          echo
          grep -q '"decision":"approved"' /tmp/r.json
          docker rm -f payrules
