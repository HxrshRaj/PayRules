name: Release

# Push a tag like v0.1.0.0 to cut a release with prebuilt binaries.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the Release and upload assets

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: payrules-linux-x86_64
            bin: payrules
          - os: macos-latest
            asset: payrules-macos-arm64
            bin: payrules
          - os: windows-latest
            asset: payrules-windows-x86_64.exe
            bin: payrules.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Cache ~/.stack
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: ${{ runner.os }}-stack-home-${{ hashFiles('stack.yaml.lock', 'PayRules.cabal') }}
          restore-keys: ${{ runner.os }}-stack-home-

      - name: Build and run the suite
        run: stack test

      - name: Install the executable
        run: stack build --copy-bins --local-bin-path ./dist

      - name: Name the artifact per platform
        shell: bash
        run: mv "./dist/${{ matrix.bin }}" "./${{ matrix.asset }}"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
